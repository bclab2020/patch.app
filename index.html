    <script type="text/babel">
        const { Steps, Button, Card, Row, Col, Alert, Checkbox, Radio, Tooltip, notification, Badge, Divider, Select, Modal } = antd;
        const { Step } = Steps;
        const { Option } = Select;

        // Initial Data Model (JSON Structure) - 12 Sports supported
        const INITIAL_PROTOCOL_DATA = {
            basePatches: [
                {
                    id: "achilles",

                    view: "front",

                    view: "back",
                    coords: [
                        { x: 78, y: 98, side: "右" },

                    ]

            ],
            sportsOptions: {
                sprinting: {

                },

                },
                tennis: {
                    id: "tennis",

                    category: "swing",
                    chains: "DFL / Arm Lines フォーカス",
                    desc: "リスト・肘の負担軽減とフットワークの敏捷性向上"
                },
                basketball: {
                    id: "basketball",
                    name: "6. バスケットボール",
                    category: "agility",
                    chains: "LL / SBL フォーカス",
                    desc: "ジャンプ到達点アップ、着地時の関節保護とクイックネス強化"
                },
                rugby: {
                    id: "rugby",
                    name: "7. ラグビー",
                    category: "agility",
                    chains: "LL / SBL フォーカス",
                    desc: "コンタクト衝撃に耐えるコア（腹圧）と首元の保護"
                },
                swimming: {
                    id: "swimming",
                    name: "8. 水泳",
                    category: "running",

                    desc: "ストリームライン（一直線姿勢）の維持とストローク効率の向上"
                },
                volleyball: {
                    id: "volleyball",
                    name: "9. バレーボール",
                    category: "agility",
                    chains: "LL / SBL フォーカス",

                },
                badminton: {
                    id: "badminton",
                    name: "10. バドミントン",
                    category: "swing",
                    chains: "DFL / Arm Lines フォーカス",
                    desc: "フットワークの急ストップ時の安定とリストターンの障害予防"
                },
                tabletennis: {
                    id: "tabletennis",
                    name: "11. 卓球",
                    category: "swing",
                    chains: "DFL / Arm Lines フォーカス",
                    desc: "微小ステップ時の敏捷性と手首のミリ単位コントロール"
                },
                judo: {
                    id: "judo",
                    name: "12. 柔道",
                    category: "agility",
                    chains: "LL / SBL フォーカス",
                    desc: "グラウンディング（踏ん張り）の強化と引き込み握力の維持"
                }
            },
            customPatches: {
                running: [
                    {
                        id: "tibialis",
                        name: "前脛骨筋起始部 (左右2枚)",
                        meridian: "SFL (Superficial Front Line / 表層フロントライン)",
                        desc: "すねの外側の筋肉（お皿の下から指4本分下、すねの骨の外側約1横指のくぼみ）。足首のスムーズな背屈と接地時の推進力を最大化し、ブレーキロスを最小限に抑えます。",
                        view: "front",
                        coords: [
                            { x: 68, y: 310, side: "右" },
                            { x: 132, y: 310, side: "左" }
                        ]
                    },
                    {
                        id: "rectus",
                        name: "大腿直筋部 (左右2枚)",
                        meridian: "SFL (Superficial Front Line / 表層フロントライン)",
                        desc: "骨盤前面の骨の出っ張り（上前腸骨棘）から真下に指3本分下。骨盤の前傾キープを容易にし、ダッシュ・ピッチ走時の大腿部スイングを滑らかにします。",
                        view: "front",
                        coords: [
                            { x: 75, y: 210, side: "右" },
                            { x: 125, y: 210, side: "左" }
                        ]
                    }
                ],
                swing: [
                    {
                        id: "epicondyle",
                        name: "上腕骨外側上顆 (左右2枚)",
                        meridian: "Arm Lines (アームライン / 腕の経絡系)",
                        desc: "肘の外側の出っ張り骨のすぐ下（前腕伸筋群起始部）。手首・肘関節の過緊張（力み）を中枢神経レベルで抑制し、体幹始動のパワー伝達を実現します。",
                        view: "front",
                        coords: [
                            { x: 48, y: 125, side: "右" },
                            { x: 152, y: 125, side: "左" }
                        ]
                    },
                    {
                        id: "subclavius",
                        name: "鎖骨下筋・小胸筋周囲 (左右2枚)",
                        meridian: "Arm Lines (深層フロントアームライン)",
                        desc: "鎖骨の外側1/3のすぐ下にあるくぼみ（大胸筋上部付近）。巻き肩をリセットし、胸郭の深い捻転とフォロースルーを支援します。",
                        view: "front",
                        coords: [
                            { x: 82, y: 80, side: "右" },
                            { x: 118, y: 80, side: "左" }
                        ]
                    }
                ],
                agility: [
                    {
                        id: "gluteus",
                        name: "大殿筋起始部 (左右2枚)",
                        meridian: "LL (ラテラルライン) / SBL (表層バックライン)",
                        desc: "骨盤の後ろの骨の出っ張り（上後腸骨棘）から斜め下外側に指3本分。股関節の爆発的な伸展パワーを引き出し、急なサイドステップや静止時の体幹バランスを制御します。",
                        view: "back",
                        coords: [
                            { x: 78, y: 192, side: "右" },
                            { x: 122, y: 194, side: "左" }
                        ]
                    },
                    {
                        id: "thoracolumbar",
                        name: "胸腰椎移行部 T12-L1 (左右2枚)",
                        meridian: "SPL (Spiral Line / スパイラルライン) / LL",
                        desc: "一番下の肋骨の先端と同じ高さで、背骨の中心から左右に指2本分外側。切り返し（方向転換）の際に加わる強い側方力および回旋Gに対して軸ブレを防止します。",
                        view: "back",
                        coords: [
                            { x: 88, y: 133, side: "右" },
                            { x: 112, y: 133, side: "左" }
                        ]
                    }
                ]
            }
        };

        // Helper to output toasts
        function showToast(msg) {
            notification.destroy();
            notification.open({
                message: msg,
                duration: 2.5,
                placement: "bottomRight",
                style: { background: "#111317", color: "#fff", border: "1px solid rgba(255,255,255,0.08)" }
            });
        }

        function KineticLinkApp() {
            const [currentView, setCurrentView] = React.useState('home'); // 'home' or 'map'
            const [currentStep, setCurrentStep] = React.useState(0);
            const [selectedSport, setSelectedSport] = React.useState(null);
            const [hoveredPointId, setHoveredPointId] = React.useState(null);
            
            // Admin coordinate adjustment states
            const [isAdmin, setIsAdmin] = React.useState(false);
            const [editMode, setEditMode] = React.useState(false);
            const [selectedPoint, setSelectedPoint] = React.useState(null);
            const [isSpecsModalOpen, setIsSpecsModalOpen] = React.useState(false);
            
            // Loaded Coordinates Database in state to support dynamic D-pad movement
            const [coordinates, setCoordinates] = React.useState(INITIAL_PROTOCOL_DATA);

            // Checkbox states to ensure active interaction
            const [baseChecked, setBaseChecked] = React.useState({
                achilles: false,
                fibular: false,
                scapula: false
            });
            const [customChecked, setCustomChecked] = React.useState({
                custom1: false,
                custom2: false
            });

            // Service worker and notifications initializer
            React.useEffect(() => {
                // Register PWA service worker
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('./sw.js')
                        .then(reg => console.log('ServiceWorker registered:', reg.scope))
                        .catch(err => console.error('ServiceWorker failed:', err));
                }

                // Check for core connect updates via GitHub Commits API
                checkPortalUpdates();
            }, []);

            // Check portal updates function
            async function checkPortalUpdates() {
                try {
                    const response = await fetch("https://api.github.com/repos/bclab2020/portal-mockup/commits");
                    if (!response.ok) return;
                    const commits = await response.json();
                    if (commits && commits.length > 0) {
                        const latestSha = commits[0].sha;
                        const savedSha = localStorage.getItem('last_notified_portal_sha');
                        const commitMsg = commits[0].commit.message || 'コンテンツが更新されました。';
                        
                        if (savedSha && savedSha !== latestSha && Notification.permission === "granted") {
                            new Notification("【CORE CONNECT 更新】", {
                                body: commitMsg,
                                icon: "icon.svg"
                            });
                        }
                        localStorage.setItem('last_notified_portal_sha', latestSha);
                    }
                } catch (e) {
                    console.error("更新チェックエラー:", e);
                }
            }

            // Next button conditions
            const isNextDisabled = () => {
                if (currentStep === 0) {
                    return !(baseChecked.achilles && baseChecked.fibular && baseChecked.scapula);
                }
                if (currentStep === 1) {
                    return !selectedSport;
                }
                if (currentStep === 2) {
                    return !(customChecked.custom1 && customChecked.custom2);
                }
                return false;
            };

            const handleNext = () => {
                if (currentStep < 2) {
                    setCurrentStep(currentStep + 1);
                } else {
                    // Protocol Completion modal/toast
                    notification.success({
                        message: "プロトコル貼付完了",
                        description: "合計10枚の感覚フィードバックパッチがすべて正しく貼付されました！神経筋制御が最適化された状態でトレーニングを開始してください。",
                        placement: "topRight"
                    });
                }
            };

            const handlePrev = () => {
                if (currentStep > 0) {
                    setCurrentStep(currentStep - 1);
                }
            };

            const handleSportSelect = (sportId) => {
                setSelectedSport(sportId);
                // Reset custom check states
                setCustomChecked({ custom1: false, custom2: false });
            };

            const getSelectedSportData = () => {
                return coordinates.sportsOptions[selectedSport] || null;
            };

            // Compile active patch coordinates for visual overlays
            const getActivePoints = () => {
                let points = [];
                
                // Base patches (always visible)
                coordinates.basePatches.forEach(p => {
                    const isHighlighted = hoveredPointId === p.id;
                    const isActive = currentStep === 0 && !baseChecked[p.id];
                    points.push({
                        ...p,
                        type: 'base',
                        highlighted: isHighlighted,
                        active: isActive
                    });
                });

                // Custom patches (visible if sport selected and currentStep is 1 or 2)
                if (selectedSport && currentStep >= 1) {
                    const sportData = getSelectedSportData();
                    if (sportData) {
                        const patchesList = coordinates.customPatches[sportData.category];
                        if (patchesList) {
                            patchesList.forEach((p, idx) => {
                                const isHighlighted = hoveredPointId === p.id;
                                const checkKey = idx === 0 ? 'custom1' : 'custom2';
                                const isActive = currentStep === 2 && !customChecked[checkKey];
                                points.push({
                                    ...p,
                                    type: 'custom',
                                    highlighted: isHighlighted,
                                    active: isActive
                                });
                            });
                        }
                    }
                }
                return points;
            };

            const activePoints = getActivePoints();

            // Admin Lock handling
            const handleAdminLockClick = () => {
                if (isAdmin) {
                    setIsAdmin(false);
                    setEditMode(false);
                    setSelectedPoint(null);
                    showToast("管理者モードからログアウトしました。");
                } else {
                    const pwd = prompt("管理者パスワードを入力してください:");
                    if (pwd === 'bclab2009') {
                        setIsAdmin(true);
                        showToast("管理者認証に成功しました。座標調整が可能です。");
                    } else if (pwd !== null) {
                        showToast("パスワードが正しくありません。");
                    }
                }
            };

            // Handle coordinate movement via D-pad
            const handleMove = (dx, dy) => {
                if (!selectedPoint) return;
                
                setCoordinates(prevCoords => {
                    const nextCoords = JSON.parse(JSON.stringify(prevCoords));
                    if (selectedPoint.type === 'base') {
                        const patch = nextCoords.basePatches.find(p => p.id === selectedPoint.id);
                        if (patch) {
                            const coord = patch.coords[selectedPoint.coordIdx];
                            if (coord) {
                                coord.x += dx;
                                coord.y += dy;
                                setSelectedPoint({ ...selectedPoint, x: coord.x, y: coord.y });
                            }
                        }
                    } else {
                        const patch = nextCoords.customPatches[selectedPoint.category].find(p => p.id === selectedPoint.id);
                        if (patch) {
                            const coord = patch.coords[selectedPoint.coordIdx];
                            if (coord) {
                                coord.x += dx;
                                coord.y += dy;
                                setSelectedPoint({ ...selectedPoint, x: coord.x, y: coord.y });
                            }
                        }
                    }
                    return nextCoords;
                });
            };

            // Export adjusted JSON coordinate parameters
            const handleExportCoordinates = () => {
                const formatted = JSON.stringify(coordinates, null, 2);
                notification.info({
                    message: "調整後の座標データ（JSON）",
                    description: (
                        <div>
                            <p style={{ fontSize: "11px" }}>以下のJSONデータをコピーしてコードに貼り付けられます：</p>
                            <textarea 
                                style={{ width: '100%', height: '160px', background: '#000', color: '#00f0ff', fontSize: '9px', fontFamily: 'monospace', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '4px', padding: '6px' }} 
                                readOnly 
                                value={formatted}
                                onClick={(e) => { e.target.select(); document.execCommand('copy'); showToast('コピーしました！'); }}
                            />
                            <span style={{ fontSize: '9px', color: 'var(--text-muted)' }}>※テキストエリアをクリックすると全選択・自動コピーされます。</span>
                        </div>
                    ),
                    duration: 0
                });
            };

            return (
                <div className="app-container">
                    {/* Header */}
                    <header className="app-header" style={{ padding: "0 24px" }}>
                        <div className="header-logo" style={{ display: "flex", flexDirection: "row", alignItems: "center", gap: "8px" }}>
                            <img src="logo_mark.png" alt="B.C Lab Logo Mark" style={{ height: "24px", width: "auto" }} />
                            <div style={{ display: "flex", flexDirection: "column" }}>
                                <div><span className="logo-bc">B.C</span><span className="logo-lab">Lab</span></div>
                                <span className="logo-sub">KINETIC-LINK 109</span>
                            </div>
                        </div>
                        
                        <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                            {currentView === 'map' && (
                                <Button 
                                    size="small" 
                                    onClick={() => { setCurrentView('home'); setEditMode(false); setSelectedPoint(null); }}
                                    style={{ background: "rgba(255,255,255,0.06)", borderColor: "rgba(255,255,255,0.1)", color: "#fff", fontSize: "11px" }}
                                >
                                    <i className="fa-solid fa-house" style={{ marginRight: "4px" }}></i> ホーム
                                </Button>
                            )}
                            <div className="adhesive-badge" style={{ background: "rgba(0, 240, 255, 0.1)", border: "1px solid rgba(0, 240, 255, 0.3)" }}>
                                <i className="fa-solid fa-circle-dot" style={{ color: "var(--secondary)" }}></i>
                                <span>パッチ枚数: <strong style={{ color: "var(--secondary)" }}>
                                    {(baseChecked.achilles ? 2 : 0) + (baseChecked.fibular ? 2 : 0) + (baseChecked.scapula ? 2 : 0) + (customChecked.custom1 ? 2 : 0) + (customChecked.custom2 ? 2 : 0)}
                                </strong> / 10 枚</span>
                            </div>
                            <button 
                                className="admin-lock-trigger" 
                                onClick={handleAdminLockClick} 
                                style={{ background: "none", border: "none", color: isAdmin ? "var(--secondary)" : "var(--text-muted)", cursor: "pointer", padding: "4px", fontSize: "14px", transition: "color 0.2s" }}
                                title={isAdmin ? "管理者ログアウト" : "管理者ログイン"}
                            >
                                <i className={isAdmin ? "fa-solid fa-lock-open" : "fa-solid fa-lock"}></i>
                            </button>
                        </div>
                    </header>

                    {/* View rendering */}
                    {currentView === 'home' ? (
                        /* HOME VIEW (Beloved Original Design Restored) */
                        <div style={{ padding: "24px", display: "flex", flexDirection: "column", gap: "20px" }}>
                            
                            {/* Welcome Card with Dynamic Brain SVG */}
                            <div className="welcome-box-card">
                                <div className="welcome-polygon-left"></div>
                                <div className="welcome-polygon-right"></div>
                                <div className="welcome-box-inner" style={{ padding: "20px" }}>
                                    <span className="welcome-brand">KINETIC-LINK 109</span>
                                    <span className="welcome-sub">SENSORY PATCHES</span>
                                    <span className="welcome-tech-detail" style={{ fontFamily: "var(--font-outfit)", fontSize: "7px", color: "var(--text-muted)", letterSpacing: "1.2px", marginTop: "-5px", marginBottom: "3px", textTransform: "uppercase" }}>Neuro-Kinetic Feedback Technology</span>
                                    <span className="welcome-pack-detail" style={{ fontFamily: "var(--font-outfit)", fontSize: "6px", color: "var(--text-muted)", opacity: 0.6, letterSpacing: "0.5px", marginTop: "-1px", marginBottom: "8px" }}>(8 PATCHES | 4 Pairs)</span>
                                    
                                    <div className="welcome-graphic-container" style={{ margin: "10px 0" }}>
                                        <svg viewBox="0 0 200 160" className="welcome-brain-svg" style={{ maxHeight: "160px", width: "100%" }}>
                                            <defs>
                                                <filter id="welcome-glow" x="-20%" y="-20%" width="140%" height="140%">
                                                    <feGaussianBlur stdDeviation="2.5" result="blur" />
                                                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                                                </filter>
                                            </defs>
                                            
                                            <g stroke="#00f0ff" strokeWidth="0.8" opacity="0.75" fill="none">
                                                <line x1="80" y1="25" x2="60" y2="35" />
                                                <line x1="60" y1="35" x2="45" y2="55" />
                                                <line x1="45" y1="55" x2="40" y2="80" />
                                                <line x1="40" y1="80" x2="45" y2="105" />
                                                <line x1="45" y1="105" x2="60" y2="125" />
                                                <line x1="60" y1="125" x2="80" y2="135" />
                                                <line x1="92" y1="35" x2="92" y2="60" />
