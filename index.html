                    },
                    {

                        desc: "鎖骨の外側1/3のすぐ下にあるくぼみ（大胸筋上部付近）。巻き肩をリセットし、スイング時の体幹の深い体幹捻転をスムーズにします。",
                        view: "front",

                            { x: 82, y: 80, side: "右" },

                        ]
                    }
                ],
                agility: [
                    {
                        id: "gluteus",
                        name: "大殿筋起始部 (左右2枚)",
                        meridian: "LL (ラテラルライン) / SBL (表層バックライン)",
                        desc: "骨盤の後ろの骨の出っ張り（上後腸骨棘）から斜め下外側に指3本分。股関節の爆発的な伸展パワーを引き出し、急なサイドステップや静止時の体幹バランスを制御します。",
                        view: "back",
                        coords: [
                            { x: 78, y: 192, side: "右" },
                            { x: 122, y: 194, side: "左" }
                        ]
                    },
                    {
                        id: "thoracolumbar",
                        name: "胸腰椎移行部 T12-L1 (左右2枚)",
                        meridian: "SPL (Spiral Line / スパイラルライン) / LL",
                        desc: "一番下の肋骨の先端と同じ高さで、背骨の中心から左右に指2本分外側。切り返し（方向転換）の際に加わる強い側方力および回旋Gに対して軸ブレを防止します。",
                        view: "back",
                        coords: [
                            { x: 88, y: 133, side: "右" },
                            { x: 112, y: 133, side: "左" }
                        ]
                    }
                ]
            }
        };

        // Helper to output toasts
        function showToast(msg) {
            notification.destroy();
            notification.open({
                message: msg,
                duration: 2.5,
                placement: "bottomRight",
                style: { background: "#111317", color: "#fff", border: "1px solid rgba(255,255,255,0.08)" }
            });
        }

        function KineticLinkApp() {
            const [currentView, setCurrentView] = React.useState('home'); // 'home' or 'map'
            const [currentStep, setCurrentStep] = React.useState(0);
            const [subStep, setSubStep] = React.useState('check'); // 'check' (VAS check) or 'patching' (Step 1 checklists)
            const [selectedSport, setSelectedSport] = React.useState(null);
            const [hoveredPointId, setHoveredPointId] = React.useState(null);
            
            // ROM Self-Check VAS Scores (0 = smooth, 10 = painful/stuck)
            const [vasScores, setVasScores] = React.useState({
                flexion: 5,
                extension: 5,
                lateral: 5,
                rotation: 5
            });

            // Assessment History
            const [vasHistory, setVasHistory] = React.useState(() => {
                const saved = localStorage.getItem('bclab_vas_history');
                return saved ? JSON.parse(saved) : [];
            });

            // Selected base patches IDs (derived from ROM evaluation)
            const [selectedBasePatches, setSelectedBasePatches] = React.useState([]);
            
            // Admin coordinate adjustment states
            const [isAdmin, setIsAdmin] = React.useState(false);
            const [editMode, setEditMode] = React.useState(false);
            const [selectedPoint, setSelectedPoint] = React.useState(null);
            const [isSpecsModalOpen, setIsSpecsModalOpen] = React.useState(false);
            
            // Persistent Coordinates loaded from localStorage or initialized with defaults
            const [basePatchPool, setBasePatchPool] = React.useState(() => {
                const saved = localStorage.getItem('bclab_custom_base_pool');
                return saved ? JSON.parse(saved) : INITIAL_BASE_PATCH_POOL;
            });
            const [coordinates, setCoordinates] = React.useState(() => {
                const saved = localStorage.getItem('bclab_custom_sports_data');
                return saved ? JSON.parse(saved) : INITIAL_PROTOCOL_DATA;
            });

            // Checkbox states to ensure active interaction
            const [baseChecked, setBaseChecked] = React.useState({
                achilles: false,
                sternum: false,
                fibular: false,
                scapula: false
            });
            const [customChecked, setCustomChecked] = React.useState({
                custom1: false,
                custom2: false
            });

            // Service worker and notifications initializer
            React.useEffect(() => {
                // Register PWA service worker
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('./sw.js')
                        .then(reg => console.log('ServiceWorker registered:', reg.scope))
                        .catch(err => console.error('ServiceWorker failed:', err));
                }

                // Check for core connect updates via GitHub Commits API
                checkPortalUpdates();
            }, []);

            // Check portal updates function
            async function checkPortalUpdates() {
                try {
                    const response = await fetch("https://api.github.com/repos/bclab2020/portal-mockup/commits");
                    if (!response.ok) return;
                    const commits = await response.json();
                    if (commits && commits.length > 0) {
                        const latestSha = commits[0].sha;
                        const savedSha = localStorage.getItem('last_notified_portal_sha');
                        const commitMsg = commits[0].commit.message || 'コンテンツが更新されました。';
                        
                        if (savedSha && savedSha !== latestSha && Notification.permission === "granted") {
                            new Notification("【CORE CONNECT 更新】", {
                                body: commitMsg,
                                icon: "icon.svg"
                            });
                        }
                        localStorage.setItem('last_notified_portal_sha', latestSha);
                    }
                } catch (e) {
                    console.error("更新チェックエラー:", e);
                }
            }

            // Next button conditions
            const isNextDisabled = () => {
                if (currentStep === 0) {
                    if (subStep === 'check') return true;
                    // Check if all selected base patches are checked off
                    return !selectedBasePatches.every(patchId => baseChecked[patchId]);
                }
                if (currentStep === 1) {
                    return !selectedSport;
                }
                if (currentStep === 2) {
                    return !(customChecked.custom1 && customChecked.custom2);
                }
                return false;
            };

            const handleNext = () => {
                if (currentStep < 2) {
                    setCurrentStep(currentStep + 1);
                } else {
                    // Protocol Completion modal/toast
                    notification.success({
                        message: "プロトコル貼付完了",
                        description: (
                            <div>
                                <p>合計10枚の感覚フィードバックパッチがすべて正しく貼付されました！神経筋制御が最適化された状態でトレーニングを開始してください。</p>
                                <div style={{ marginTop: "12px", borderTop: "1px solid rgba(255,255,255,0.06)", paddingTop: "8px" }}>
                                    <span style={{ fontSize: "11px", color: "var(--secondary)", fontWeight: "bold" }}>📱 改善成果をシェアしませんか？</span>
                                    <p style={{ fontSize: "10px", margin: "4px 0 8px 0" }}>前回の身体測定履歴と比較した動きやすさの改善をSNSに発信できます。</p>
                                    {vasHistory.length > 1 ? (
                                        <Button 
                                            size="small" 
                                            type="primary" 
                                            style={{ background: "linear-gradient(135deg, #1DA1F2 0%, #0d8bd9 100%)", borderColor: "transparent", fontSize: "10px", color: "#fff" }}
                                            onClick={() => handleSnsShare(vasHistory[vasHistory.length - 1], vasHistory[0])}
                                        >
                                            <i className="fa-brands fa-x-twitter"></i> 改善の喜びをポストする
                                        </Button>
                                    ) : (
                                        <Button 
                                            size="small" 
                                            type="primary" 
                                            style={{ background: "linear-gradient(135deg, #1DA1F2 0%, #0d8bd9 100%)", borderColor: "transparent", fontSize: "10px", color: "#fff" }}
                                            onClick={() => handleSnsShare(null, vasHistory[0] || vasScores)}
                                        >
                                            <i className="fa-brands fa-x-twitter"></i> 状態をポストする
                                        </Button>
                                    )}
                                </div>
                            </div>
                        ),
                        duration: 0,
                        placement: "topRight"
                    });
                }
            };

            const handlePrev = () => {
                if (currentStep > 0) {
                    setCurrentStep(currentStep - 1);
                }
            };

            const handleSportSelect = (sportId) => {
                setSelectedSport(sportId);
                // Reset custom check states
                setCustomChecked({ custom1: false, custom2: false });
            };

            const getSelectedSportData = () => {
                return coordinates.sportsOptions[selectedSport] || null;
            };

            // Compile active patch coordinates for visual overlays
            const getActivePoints = () => {
                let points = [];
                
                // Base patches (rendered only if selectedBasePatches has them and currentStep is 0 or 1/2)
                selectedBasePatches.forEach(patchId => {
                    const p = basePatchPool[patchId];
                    if (p) {
                        const isHighlighted = hoveredPointId === p.id;
                        const isActive = currentStep === 0 && !baseChecked[p.id];
                        points.push({
                            ...p,
                            type: 'base',
                            highlighted: isHighlighted,
                            active: isActive
                        });
                    }
                });

                // Custom patches (visible if sport selected and currentStep is 1 or 2)
                if (selectedSport && currentStep >= 1) {
                    const sportData = getSelectedSportData();
                    if (sportData) {
                        const patchesList = coordinates.customPatches[sportData.category];
                        if (patchesList) {
                            patchesList.forEach((p, idx) => {
                                const isHighlighted = hoveredPointId === p.id;
                                const checkKey = idx === 0 ? 'custom1' : 'custom2';
                                const isActive = currentStep === 2 && !customChecked[checkKey];
                                points.push({
                                    ...p,
                                    type: 'custom',
                                    highlighted: isHighlighted,
                                    active: isActive
                                });
                            });
                        }
                    }
                }
                return points;
            };

            const activePoints = getActivePoints();

            // Admin Lock handling
            const handleAdminLockClick = () => {
                if (isAdmin) {
                    setIsAdmin(false);
                    setEditMode(false);
                    setSelectedPoint(null);
                    showToast("管理者モードからログアウトしました。");
                } else {
                    const pwd = prompt("管理者パスワードを入力してください:");
                    if (pwd === 'bclab2009') {
                        setIsAdmin(true);
                        showToast("管理者認証に成功しました。座標調整が可能です。");
                    } else if (pwd !== null) {
                        showToast("パスワードが正しくありません。");
                    }
                }
            };

            // Handle coordinate movement via D-pad
            const handleMove = (dx, dy) => {
                if (!selectedPoint) return;
                
                if (selectedPoint.type === 'base') {
                    setBasePatchPool(prevPool => {
                        const nextPool = JSON.parse(JSON.stringify(prevPool));
                        const patch = nextPool[selectedPoint.id];
                        if (patch) {
                            const coord = patch.coords[selectedPoint.coordIdx];
                            if (coord) {
                                coord.x += dx;
                                coord.y += dy;
                                setSelectedPoint({ ...selectedPoint, x: coord.x, y: coord.y });
                            }
                        }
                        return nextPool;
                    });
                } else {
                    setCoordinates(prevCoords => {
                        const nextCoords = JSON.parse(JSON.stringify(prevCoords));
                        const patch = nextCoords.customPatches[selectedPoint.category].find(p => p.id === selectedPoint.id);
                        if (patch) {
                            const coord = patch.coords[selectedPoint.coordIdx];
                            if (coord) {
                                coord.x += dx;
                                coord.y += dy;
                                setSelectedPoint({ ...selectedPoint, x: coord.x, y: coord.y });
                            }
                        }
                        return nextCoords;
                    });
                }
            };

            // Save and finalize adjusted coordinates to localStorage
            const handleFinalizeCoordinates = () => {
                localStorage.setItem('bclab_custom_base_pool', JSON.stringify(basePatchPool));
                localStorage.setItem('bclab_custom_sports_data', JSON.stringify(coordinates));
                showToast("調整後の座標データをブラウザに確定保存しました！次回起動時もこの座標が適用されます。");
            };

            // Reset coordinates to database defaults
            const handleResetCoordinates = () => {
                if (confirm("座標データをすべて初期位置（デフォルト）に戻しますか？")) {
                    localStorage.removeItem('bclab_custom_base_pool');
                    localStorage.removeItem('bclab_custom_sports_data');
                    setBasePatchPool(INITIAL_BASE_PATCH_POOL);
                    setCoordinates(INITIAL_PROTOCOL_DATA);
                    setSelectedPoint(null);
                    showToast("座標をデフォルト状態にリセットしました。");
                }
            };

            // Export coordinates as JSON log
            const handleExportCoordinates = () => {
                const combined = {
                    basePatches: Object.values(basePatchPool),
                    customPatches: coordinates.customPatches,
                    sportsOptions: coordinates.sportsOptions
                };
                const formatted = JSON.stringify(combined, null, 2);
                notification.info({
                    message: "座標データ（JSON）",
                    description: (
                        <div>
                            <p style={{ fontSize: "11px" }}>以下のJSONデータをコピーしてコードに貼り付けられます：</p>
                            <textarea 
                                style={{ width: '100%', height: '150px', background: '#000', color: '#00f0ff', fontSize: '9px', fontFamily: 'monospace', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '4px', padding: '6px' }} 
                                readOnly 
                                value={formatted}
                                onClick={(e) => { e.target.select(); document.execCommand('copy'); showToast('コピーしました！'); }}
                            />
                            <span style={{ fontSize: '9px', color: 'var(--text-muted)' }}>※テキストエリアをクリックすると全選択・自動コピーされます。</span>
                        </div>
                    ),
                    duration: 0
                });
            };

                                                    <div></div>
                                                </div>
                                                
                                                <div style={{ display: "flex", justifyContent: "center", gap: "8px", marginTop: "8px" }}>

                                                        <i className="fa-solid fa-download"></i> 座標JSONデータを出力

                                            </div>

                                </p>
                                <p style={{ margin: "0 0 4px 0" }}>
                                    *2 **SA-II 機械受容器 (Ruffini終末)**: 皮膚の張力（引っ張り）に鋭敏に反応し、関節角度の変化や動作中の関節運動感覚（固有受容感覚：Proprioception）を高解像度化します。

                                    - Menz, H. B., et al. (2005). Foot stimulation and postural stability in older adults. *Journal of NeuroEngineering and Rehabilitation*, 2(1), 19.<br />
                                    - Proske, U., & Gandevia, S. C. (2012). The proprioceptive senses: Their roles in signaling joint position, movement, and muscle force. *Physiological Reviews*, 92(4), 1651-1697.
                                </p>
                            </footer>
                        </div>
                    )}

                                            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: "10px" }}>
