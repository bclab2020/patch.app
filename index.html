<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B.C Lab - KINETIC-LINK 109 Portal</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Ant Design 4.24.15 CSS and JS CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/antd/4.24.15/antd.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/antd/4.24.15/antd.min.js"></script>
    
    <link rel="stylesheet" href="styles.css">
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050506">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { Steps, Button, Card, Row, Col, Alert, Checkbox, Radio, Tooltip, notification, Badge, Divider, Select } = antd;
        const { Step } = Steps;
        const { Option } = Select;

        // 1. Data Model (JSON Structure) - 12 Sports supported
        const PROTOCOL_DATA = {
            basePatches: [
                {
                    id: "achilles",
                    name: "アキレス腱遠位部 (左右2枚)",
                    meridian: "SBL (Superficial Back Line / 表層バックライン)",
                    desc: "アキレス腱の付着部付近（かかとの骨の上端から指1.5本分上）。下肢後面の張力バランスを整え、直立・動作時の前後動揺を抑制します。",
                    view: "back",
                    coords: [
                        { x: 86, y: 365, side: "右" },
                        { x: 114, y: 365, side: "左" }
                    ]
                },
                {
                    id: "fibular",
                    name: "腓骨頭外側 (左右2枚)",
                    meridian: "LL (Lateral Line) / SPL (Spiral Line)",
                    desc: "膝関節外側の下部にある骨の出っ張り（腓骨頭）の直下。側方のブレを抑え、骨盤回旋のパワー伝達を安定化させます。",
                    view: "front",
                    coords: [
                        { x: 60, y: 285, side: "右" },
                        { x: 140, y: 285, side: "左" }
                    ]
                },
                {
                    id: "scapula",
                    name: "肩甲骨内側縁 (左右2枚)",
                    meridian: "Arm Lines (アームライン) / SPL (スパイラルライン)",
                    desc: "肩甲骨の内側のフチの中央付近（背骨から指2本分外側）。胸郭と肩甲帯の動的連動を高め、腕の余分な力みを取り除きます。",
                    view: "back",
                    coords: [
                        { x: 78, y: 98, side: "右" },
                        { x: 122, y: 98, side: "左" }
                    ]
                }
            ],
            sportsOptions: {
                sprinting: {
                    id: "sprinting",
                    name: "1. 陸上（スプリント・跳躍）",
                    category: "running",
                    chains: "SBL / SFL フォーカス",
                    desc: "走動作の推進力・ピッチ・接地感覚を最大化するプロトコール"
                },
                soccer: {
                    id: "soccer",
                    name: "2. サッカー",
                    category: "agility",
                    chains: "LL / SBL フォーカス",
                    desc: "キック時の軸ブレ防止、急激な切り返し（アジリティ）を強化"
                },
                baseball: {
                    id: "baseball",
                    name: "3. 野球",
                    category: "swing",
                    chains: "DFL / Arm Lines フォーカス",
                    desc: "投球時の肩甲骨・胸郭連動、バッティング時のスイング軸を安定"
                },
                golf: {
                    id: "golf",
                    name: "4. ゴルフ",
                    category: "swing",
                    chains: "DFL / Arm Lines フォーカス",
                    desc: "アドレス時の重心安定、体幹（スイング軸）の安定を促す"
                },
                tennis: {
                    id: "tennis",
                    name: "5. テニス",
                    category: "swing",
                    chains: "DFL / Arm Lines フォーカス",
                    desc: "リスト・肘の負担軽減とフットワークの敏捷性向上"
                },
                basketball: {
                    id: "basketball",
                    name: "6. バスケットボール",
                    category: "agility",
                    chains: "LL / SBL フォーカス",
                    desc: "ジャンプ到達点アップ、着地時の関節保護とクイックネス強化"
                },
                rugby: {
                    id: "rugby",
                    name: "7. ラグビー",
                    category: "agility",
                    chains: "LL / SBL フォーカス",
                    desc: "コンタクト衝撃に耐えるコア（腹圧）と首元の保護"
                },
                swimming: {
                    id: "swimming",
                    name: "8. 水泳",
                    category: "running",
                    chains: "SBL / SFL フォーカス",
                    desc: "ストリームライン（一直線姿勢）の維持とストローク効率の向上"
                },
                volleyball: {
                    id: "volleyball",
                    name: "9. バレーボール",
                    category: "agility",
                    chains: "LL / SBL フォーカス",
                    desc: "スパイクスイングスピードの向上と着地によるジャンパー膝予防"
                },
                badminton: {
                    id: "badminton",
                    name: "10. バドミントン",
                    category: "swing",
                    chains: "DFL / Arm Lines フォーカス",
                    desc: "フットワークの急ストップ時の安定とリストターンの障害予防"
                },
                tabletennis: {
                    id: "tabletennis",
                    name: "11. 卓球",
                    category: "swing",
                    chains: "DFL / Arm Lines フォーカス",
                    desc: "微小ステップ時の敏捷性と手首のミリ単位コントロール"
                },
                judo: {
                    id: "judo",
                    name: "12. 柔道",
                    category: "agility",
                    chains: "LL / SBL フォーカス",
                    desc: "グラウンディング（踏ん張り）の強化と引き込み握力の維持"
                }
            },
            customPatches: {
                running: [
                    {
                        id: "tibialis",
                        name: "前脛骨筋起始部 (左右2枚)",
                        meridian: "SFL (Superficial Front Line / 表層フロントライン)",
                        desc: "すねの外側の筋肉（お皿の下から指4本分下、すねの骨の外側約1横指のくぼみ）。足首のスムーズな背屈と接地時の推進力を最大化し、ブレーキロスを最小限に抑えます。",
                        view: "front",
                        coords: [
                            { x: 68, y: 310, side: "右" },
                            { x: 132, y: 310, side: "左" }
                        ]
                    },
                    {
                        id: "rectus",
                        name: "大腿直筋部 (左右2枚)",
                        meridian: "SFL (Superficial Front Line / 表層フロントライン)",
                        desc: "骨盤前面の骨の出っ張り（上前腸骨棘）から真下に指3本分下。骨盤の前傾キープを容易にし、ダッシュ・ピッチ走時の大腿部スイングを滑らかにします。",
                        view: "front",
                        coords: [
                            { x: 75, y: 210, side: "右" },
                            { x: 125, y: 210, side: "左" }
                        ]
                    }
                ],
                swing: [
                    {
                        id: "epicondyle",
                        name: "上腕骨外側上顆 (左右2枚)",
                        meridian: "Arm Lines (アームライン / 腕の経絡系)",
                        desc: "肘の外側の出っ張り骨のすぐ下（前腕伸筋群起始部）。手首・肘関節の過緊張（力み）を中枢神経レベルで抑制し、体幹始動のパワー伝達を実現します。",
                        view: "front",
                        coords: [
                            { x: 48, y: 125, side: "右" },
                            { x: 152, y: 125, side: "左" }
                        ]
                    },
                    {
                        id: "subclavius",
                        name: "鎖骨下筋・小胸筋周囲 (左右2枚)",
                        meridian: "Arm Lines (深層フロントアームライン)",
                        desc: "鎖骨の外側1/3のすぐ下にあるくぼみ（大胸筋上部付近）。胸郭と肩甲骨の連動性をリセットし、スイング時の体幹の深い捻転と解放をスムーズにします。",
                        view: "front",
                        coords: [
                            { x: 82, y: 80, side: "右" },
                            { x: 118, y: 80, side: "左" }
                        ]
                    }
                ],
                agility: [
                    {
                        id: "gluteus",
                        name: "大殿筋起始部 (左右2枚)",
                        meridian: "LL (ラテラルライン) / SBL (表層バックライン)",
                        desc: "骨盤の後ろの骨の出っ張り（上後腸骨棘）から斜め下外側に指3本分。股関節の爆発的な伸展パワーを引き出し、急なサイドステップや静止時の体幹バランスを制御します。",
                        view: "back",
                        coords: [
                            { x: 78, y: 192, side: "右" },
                            { x: 122, y: 194, side: "左" }
                        ]
                    },
                    {
                        id: "thoracolumbar",
                        name: "胸腰椎移行部 T12-L1 (左右2枚)",
                        meridian: "SPL (Spiral Line / スパイラルライン) / LL",
                        desc: "一番下の肋骨の先端と同じ高さで、背骨の中心から左右に指2本分外側。切り返し（方向転換）の際に加わる強い側方力および回旋Gに対して軸ブレを防止します。",
                        view: "back",
                        coords: [
                            { x: 88, y: 133, side: "右" },
                            { x: 112, y: 133, side: "左" }
                        ]
                    }
                ]
            }
        };

        function KineticLinkApp() {
            const [currentStep, setCurrentStep] = React.useState(0);
            const [selectedSport, setSelectedSport] = React.useState(null);
            const [hoveredPointId, setHoveredPointId] = React.useState(null);
            
            // Checkbox states to ensure active interaction
            const [baseChecked, setBaseChecked] = React.useState({
                achilles: false,
                fibular: false,
                scapula: false
            });
            const [customChecked, setCustomChecked] = React.useState({
                custom1: false,
                custom2: false
            });

            // Service worker and notifications initializer
            React.useEffect(() => {
                // Register PWA service worker
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('./sw.js')
                        .then(reg => console.log('ServiceWorker registered:', reg.scope))
                        .catch(err => console.error('ServiceWorker failed:', err));
                }

                // Check for core connect updates via GitHub Commits API
                checkPortalUpdates();
            }, []);

            // Check portal updates function
            async function checkPortalUpdates() {
                try {
                    const response = await fetch("https://api.github.com/repos/bclab2020/portal-mockup/commits");
                    if (!response.ok) return;
                    const commits = await response.json();
                    if (commits && commits.length > 0) {
                        const latestSha = commits[0].sha;
                        const savedSha = localStorage.getItem('last_notified_portal_sha');
                        const commitMsg = commits[0].commit.message || 'コンテンツが更新されました。';
                        
                        if (savedSha && savedSha !== latestSha && Notification.permission === "granted") {
                            new Notification("【CORE CONNECT 更新】", {
                                body: commitMsg,
                                icon: "icon.svg"
                            });
                        }
                        localStorage.setItem('last_notified_portal_sha', latestSha);
                    }
                } catch (e) {
                    console.error("更新チェックエラー:", e);
                }
            }

            // Next button conditions
            const isNextDisabled = () => {
                if (currentStep === 0) {
                    return !(baseChecked.achilles && baseChecked.fibular && baseChecked.scapula);
                }
                if (currentStep === 1) {
                    return !selectedSport;
                }
                if (currentStep === 2) {
                    return !(customChecked.custom1 && customChecked.custom2);
                }
                return false;
            };

            const handleNext = () => {
                if (currentStep < 2) {
                    setCurrentStep(currentStep + 1);
                } else {
                    // Protocol Completion modal/toast
                    notification.success({
                        message: "プロトコル貼付完了",
                        description: "合計10枚の感覚フィードバックパッチがすべて正しく貼付されました！神経筋制御が最適化された状態でトレーニングを開始してください。",
                        placement: "topRight"
                    });
                }
            };

            const handlePrev = () => {
                if (currentStep > 0) {
                    setCurrentStep(currentStep - 1);
                }
            };

            const handleSportSelect = (sportId) => {
                setSelectedSport(sportId);
                // Reset custom check states
                setCustomChecked({ custom1: false, custom2: false });
            };

            const getSelectedSportData = () => {
                return PROTOCOL_DATA.sportsOptions[selectedSport] || null;
            };

            // Compile active patch coordinates for visual overlays
            const getActivePoints = () => {
                let points = [];
                
                // Base patches (always visible)
                PROTOCOL_DATA.basePatches.forEach(p => {
                    const isHighlighted = hoveredPointId === p.id;
                    const isActive = currentStep === 0 && !baseChecked[p.id];
                    points.push({
                        ...p,
                        type: 'base',
                        highlighted: isHighlighted,
                        active: isActive
                    });
                });

                // Custom patches (visible if sport selected and currentStep is 1 or 2)
                if (selectedSport && currentStep >= 1) {
                    const sportData = getSelectedSportData();
                    if (sportData) {
                        const patchesList = PROTOCOL_DATA.customPatches[sportData.category];
                        if (patchesList) {
                            patchesList.forEach((p, idx) => {
                                const isHighlighted = hoveredPointId === p.id;
                                const checkKey = idx === 0 ? 'custom1' : 'custom2';
                                const isActive = currentStep === 2 && !customChecked[checkKey];
                                points.push({
                                    ...p,
                                    type: 'custom',
                                    highlighted: isHighlighted,
                                    active: isActive
                                });
                            });
                        }
                    }
                }
                return points;
            };

            const activePoints = getActivePoints();

            return (
                <div className="app-container">
                    {/* Header */}
                    <header className="app-header" style={{ padding: "0 24px" }}>
                        <div className="header-logo" style={{ display: "flex", flexDirection: "row", alignItems: "center", gap: "8px" }}>
                            <img src="logo_mark.png" alt="B.C Lab Logo Mark" style={{ height: "24px", width: "auto" }} />
                            <div style={{ display: "flex", flexDirection: "column" }}>
                                <div><span className="logo-bc">B.C</span><span className="logo-lab">Lab</span></div>
                                <span className="logo-sub">KINETIC-LINK 109</span>
                            </div>
                        </div>
                        <div className="adhesive-badge" style={{ background: "rgba(0, 240, 255, 0.1)", border: "1px solid rgba(0, 240, 255, 0.3)" }}>
                            <i className="fa-solid fa-circle-dot" style={{ color: "var(--secondary)" }}></i>
                            <span>使用パッチ: <strong style={{ color: "var(--secondary)" }}>
                                {(baseChecked.achilles ? 2 : 0) + (baseChecked.fibular ? 2 : 0) + (baseChecked.scapula ? 2 : 0) + (customChecked.custom1 ? 2 : 0) + (customChecked.custom2 ? 2 : 0)}
                            </strong> / 10 枚</span>
                        </div>
                    </header>

                    {/* Main UI grid */}
                    <div style={{ padding: "24px", flex: 1, display: "flex", flexDirection: "column", gap: "20px" }}>
                        
                        {/* Core Constraints Warning */}
                        <Alert
                            message="【重要】NG貼付ゾーンの厳守"
                            description="足の裏（足底腱膜）および手のひら（手掌）は、極度な発汗やシューズ内摩擦によりパッチが剥がれやすいため、絶対に貼付しないでください。本プロトコルはNGゾーンを排除して全身の姿勢反射経路を最適化するシステムです。"
                            type="warning"
                            showIcon
                            icon={<i className="fa-solid fa-ban" style={{ color: "#ff007f", fontSize: "16px" }}></i>}
                        />

                        {/* AntD Steps Indicator */}
                        <div className="card-glass" style={{ padding: "20px", borderRadius: "12px" }}>
                            <Steps current={currentStep} size="small">
                                <Step title="基本姿勢の安定" description="ベース6枚貼付" />
                                <Step title="競技カテゴリ選択" description="種目・課題選択" />
                                <Step title="カスタム強化" description="残り4枚貼付" />
                            </Steps>
                        </div>

                        {/* Two Columns Dashboard */}
                        <Row gutter={[20, 20]} style={{ flex: 1 }}>
                            
                            {/* Left Side: Wizard step controls */}
                            <Col xs={24} md={13} style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
                                
                                {currentStep === 0 && (
                                    <div className="card-glass" style={{ padding: "20px", borderRadius: "12px", flex: 1 }}>
                                        <div style={{ marginBottom: "16px" }}>
                                            <h3 style={{ color: "var(--secondary)", margin: 0 }}><i className="fa-solid fa-shield-halved"></i> STEP 1: 姿勢土台の安定化 (Base Stabilization)</h3>
                                            <p style={{ color: "var(--text-muted)", fontSize: "12px", margin: "4px 0 0 0" }}>
                                                Pelvic-Thoracic-Head Alignment（骨盤・胸郭・頭部の一致）を確立し、全身の運動連鎖の基盤となる姿勢反射をリセットする基本の6枚です。全員必須。
                                            </p>
                                        </div>

                                        <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
                                            {PROTOCOL_DATA.basePatches.map(p => (
                                                <div 
                                                    key={p.id}
                                                    className="info-card" 
                                                    style={{ 
                                                        margin: 0, 
                                                        borderColor: hoveredPointId === p.id ? "var(--secondary)" : "rgba(255,255,255,0.06)",
                                                        background: hoveredPointId === p.id ? "rgba(0, 240, 255, 0.03)" : "rgba(15, 23, 42, 0.3)"
                                                    }}
                                                    onMouseEnter={() => setHoveredPointId(p.id)}
                                                    onMouseLeave={() => setHoveredPointId(null)}
                                                >
                                                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: "8px" }}>
                                                        <div style={{ flex: 1 }}>
                                                            <span style={{ fontSize: "10px", color: "var(--primary)", fontWeight: "bold", textTransform: "uppercase" }}>{p.meridian}</span>
                                                            <h4 style={{ margin: "2px 0 6px 0", color: "#ffffff", fontSize: "14px" }}>{p.name}</h4>
                                                            <p style={{ margin: 0, fontSize: "11px", color: "var(--text-muted)", lineHeight: "1.4" }}>{p.desc}</p>
                                                        </div>
                                                        <Checkbox 
                                                            checked={baseChecked[p.id]} 
                                                            onChange={(e) => setBaseChecked({ ...baseChecked, [p.id]: e.target.checked })}
                                                            style={{ transform: "scale(1.25)", marginTop: "4px" }}
                                                        />
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {currentStep === 1 && (
                                    <div className="card-glass" style={{ padding: "20px", borderRadius: "12px", flex: 1 }}>
                                        <div style={{ marginBottom: "16px" }}>
                                            <h3 style={{ color: "var(--secondary)", margin: 0 }}><i className="fa-solid fa-gamepad"></i> STEP 2: 競技カテゴリ・動作特性の選択</h3>
                                            <p style={{ color: "var(--text-muted)", fontSize: "12px", margin: "4px 0 0 0" }}>
                                                ご自身の競技特性や現在の主要な課題に最も合致するカテゴリを、現在サポートされている12の種目から選択してください。
                                            </p>
                                        </div>

                                        <div style={{ marginBottom: "20px" }}>
                                            <label style={{ display: "block", color: "var(--text-muted)", fontSize: "11px", marginBottom: "6px", fontWeight: "bold" }}>対象競技種目</label>
                                            <Select
                                                showSearch
                                                style={{ width: '100%' }}
                                                placeholder="競技種目を選択してください"
                                                optionFilterProp="children"
                                                value={selectedSport}
                                                onChange={handleSportSelect}
                                                dropdownStyle={{ background: '#111317', border: '1px solid rgba(255,255,255,0.08)' }}
                                            >
                                                {Object.values(PROTOCOL_DATA.sportsOptions).map(sport => (
                                                    <Option key={sport.id} value={sport.id} style={{ color: '#fff', background: '#111317' }}>
                                                        {sport.name}
                                                    </Option>
                                                ))}
                                            </Select>
                                        </div>

                                        {selectedSport && (
                                            <Card 
                                                style={{ 
                                                    borderColor: "var(--secondary)", 
                                                    background: "rgba(0, 240, 255, 0.04)"
                                                }}
                                            >
                                                <div style={{ display: "flex", gap: "12px", alignItems: "center" }}>
                                                    <div style={{ 
                                                        width: "40px", 
                                                        height: "40px", 
                                                        borderRadius: "50%", 
                                                        background: "var(--secondary)", 
                                                        display: "flex",
                                                        alignItems: "center",
                                                        justifyContent: "center",
                                                        color: "var(--text-dark)"
                                                    }}>
                                                        {getSelectedSportData()?.category === 'running' && <i className="fa-solid fa-person-running" style={{ fontSize: "18px" }}></i>}
                                                        {getSelectedSportData()?.category === 'swing' && <i className="fa-solid fa-golf-ball-tee" style={{ fontSize: "18px" }}></i>}
                                                        {getSelectedSportData()?.category === 'agility' && <i className="fa-solid fa-basketball" style={{ fontSize: "18px" }}></i>}
                                                    </div>
                                                    <div style={{ flex: 1 }}>
                                                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: "4px" }}>
                                                            <h4 style={{ margin: 0, color: "#ffffff", fontSize: "16px", fontWeight: "bold" }}>{getSelectedSportData()?.name}</h4>
                                                            <span style={{ fontSize: "9px", color: "var(--secondary)", background: "rgba(0,240,255,0.1)", padding: "2px 8px", borderRadius: "10px", fontWeight: "bold" }}>
                                                                {getSelectedSportData()?.chains}
                                                            </span>
                                                        </div>
                                                        <p style={{ margin: "6px 0 0 0", fontSize: "12px", color: "var(--text-main)", lineHeight: "1.4" }}>
                                                            {getSelectedSportData()?.desc}
                                                        </p>
                                                    </div>
                                                </div>
                                            </Card>
                                        )}
                                    </div>
                                )}

                                {currentStep === 2 && (
                                    <div className="card-glass" style={{ padding: "20px", borderRadius: "12px", flex: 1 }}>
                                        <div style={{ marginBottom: "16px" }}>
                                            <h3 style={{ color: "var(--secondary)", margin: 0 }}><i className="fa-solid fa-bolt"></i> STEP 3: カスタム強化 (Custom Enhancement)</h3>
                                            <p style={{ color: "var(--text-muted)", fontSize: "12px", margin: "4px 0 0 0" }}>
                                                選択した競技特性に合わせて、残りの4枚を貼付します。これにより、特定の筋膜ラインの動的剛性や運動可動域を最適化します。
                                            </p>
                                        </div>

                                        <div style={{ marginBottom: "12px", background: "rgba(0,240,255,0.03)", border: "1px solid rgba(0,240,255,0.15)", borderRadius: "8px", padding: "10px 14px" }}>
                                            <span style={{ fontSize: "9px", color: "var(--secondary)", fontWeight: "bold" }}>選択されたプログラム</span>
                                            <div style={{ fontSize: "14px", fontWeight: "bold", color: "#ffffff" }}>
                                                {getSelectedSportData()?.name} ({getSelectedSportData()?.chains})
                                            </div>
                                        </div>

                                        <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
                                            {PROTOCOL_DATA.customPatches[getSelectedSportData()?.category]?.map((p, idx) => {
                                                const checkKey = idx === 0 ? 'custom1' : 'custom2';
                                                return (
                                                    <div 
                                                        key={p.id}
                                                        className="info-card" 
                                                        style={{ 
                                                            margin: 0, 
                                                            borderColor: hoveredPointId === p.id ? "var(--secondary)" : "rgba(255,255,255,0.06)",
                                                            background: hoveredPointId === p.id ? "rgba(0, 240, 255, 0.03)" : "rgba(15, 23, 42, 0.3)"
                                                        }}
                                                        onMouseEnter={() => setHoveredPointId(p.id)}
                                                        onMouseLeave={() => setHoveredPointId(null)}
                                                    >
                                                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: "8px" }}>
                                                            <div style={{ flex: 1 }}>
                                                                <span style={{ fontSize: "10px", color: "var(--secondary)", fontWeight: "bold", textTransform: "uppercase" }}>{p.meridian}</span>
                                                                <h4 style={{ margin: "2px 0 6px 0", color: "#ffffff", fontSize: "14px" }}>{p.name}</h4>
                                                                <p style={{ margin: 0, fontSize: "11px", color: "var(--text-muted)", lineHeight: "1.4" }}>{p.desc}</p>
                                                            </div>
                                                            <Checkbox 
                                                                checked={customChecked[checkKey]} 
                                                                onChange={(e) => setCustomChecked({ ...customChecked, [checkKey]: e.target.checked })}
                                                                style={{ transform: "scale(1.25)", marginTop: "4px" }}
                                                            />
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}

                                {/* Action Buttons */}
                                <div style={{ display: "flex", justifyContent: "space-between", marginTop: "8px" }}>
                                    <Button 
                                        disabled={currentStep === 0} 
                                        onClick={handlePrev}
                                        style={{ background: "rgba(255,255,255,0.05)", borderColor: "rgba(255,255,255,0.15)", color: "#ffffff" }}
                                    >
                                        <i className="fa-solid fa-arrow-left" style={{ marginRight: "6px" }}></i> 戻る
                                    </Button>
                                    <Button 
                                        type="primary" 
                                        disabled={isNextDisabled()} 
                                        onClick={handleNext}
                                        style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", gap: "6px" }}
                                    >
                                        {currentStep === 2 ? "プロトコル完了" : "次へ進む"} <i className="fa-solid fa-arrow-right"></i>
                                    </Button>
                                </div>
                            </Col>

                            {/* Right Side: Interactive side-by-side silhouette visualizer */}
                            <Col xs={24} md={11}>
                                <div className="card-glass" style={{ padding: "20px", borderRadius: "12px", display: "flex", flexDirection: "column", gap: "16px", height: "100%" }}>
                                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                        <h4 style={{ margin: 0, color: "var(--text-main)" }}><i className="fa-solid fa-street-view"></i> 3D 感覚受容器マッピング (全10ポイント)</h4>
                                        <Badge status="processing" text={<span style={{ fontSize: "10px", color: "var(--text-muted)" }}>LIVE FEEDBACK</span>} />
                                    </div>

                                    {/* Visualizer container: Front and Back side-by-side */}
                                    <div className="visualizer-container">
                                        
                                        {/* Front view silhouette */}
                                        <div className="visualizer-pane">
                                            <div className="visualizer-title">前面 (FRONT)</div>
                                            <div className="body-svg-wrapper">
                                                <svg viewBox="0 0 200 400" style={{ width: "100%", height: "100%" }}>
                                                    <image href="body_front.png" x="0" y="0" width="200" height="400" />
                                                    
                                                    {/* Draw active front points */}
                                                    {activePoints.filter(p => p.view === 'front').map(p => (
                                                        p.coords.map((coord, idx) => (
                                                            <g 
                                                                key={`${p.id}-${idx}`}
                                                                className={`anatomy-dot ${p.type} ${p.highlighted ? 'highlighted' : ''} ${p.active ? 'active' : ''}`}
                                                                onMouseEnter={() => setHoveredPointId(p.id)}
                                                                onMouseLeave={() => setHoveredPointId(null)}
                                                            >
                                                                <circle cx={coord.x} cy={coord.y} r="5" stroke="#000" strokeWidth="1.5" />
                                                                <text x={coord.x} y={coord.y - 8} fontSize="7" fill="#fff" textAnchor="middle" fontWeight="bold" stroke="#000" strokeWidth="0.8" paintOrder="stroke">{coord.side}</text>
                                                            </g>
                                                        ))
                                                    ))}

                                                    {/* Palms NG Zone indicators */}
                                                    <g>
                                                        {/* Right Hand Palm */}
                                                        <circle cx="32" cy="158" r="6" stroke="#ff0050" strokeWidth="2" fill="none" opacity="0.85" />
                                                        <line x1="28" y1="154" x2="36" y2="162" stroke="#ff0050" strokeWidth="2" opacity="0.85" />
                                                        <line x1="36" y1="154" x2="28" y2="162" stroke="#ff0050" strokeWidth="2" opacity="0.85" />
                                                        
                                                        {/* Left Hand Palm */}
                                                        <circle cx="168" cy="158" r="6" stroke="#ff0050" strokeWidth="2" fill="none" opacity="0.85" />
                                                        <line x1="164" y1="154" x2="172" y2="162" stroke="#ff0050" strokeWidth="2" opacity="0.85" />
                                                        <line x1="172" y1="154" x2="164" y2="162" stroke="#ff0050" strokeWidth="2" opacity="0.85" />

                                                        <text x="32" y="146" fontSize="5" fill="#ff0050" textAnchor="middle" fontWeight="bold">掌NG</text>
                                                        <text x="168" y="146" fontSize="5" fill="#ff0050" textAnchor="middle" fontWeight="bold">掌NG</text>
                                                    </g>
                                                </svg>
                                            </div>
                                        </div>

                                        {/* Back view silhouette */}
                                        <div className="visualizer-pane">
                                            <div className="visualizer-title">背面 (BACK)</div>
                                            <div className="body-svg-wrapper">
                                                <svg viewBox="0 0 200 400" style={{ width: "100%", height: "100%" }}>
                                                    <image href="body_back.png" x="0" y="0" width="200" height="400" />
                                                    
                                                    {/* Draw active back points */}
                                                    {activePoints.filter(p => p.view === 'back').map(p => (
                                                        p.coords.map((coord, idx) => (
                                                            <g 
                                                                key={`${p.id}-${idx}`}
                                                                className={`anatomy-dot ${p.type} ${p.highlighted ? 'highlighted' : ''} ${p.active ? 'active' : ''}`}
                                                                onMouseEnter={() => setHoveredPointId(p.id)}
                                                                onMouseLeave={() => setHoveredPointId(null)}
                                                            >
                                                                <circle cx={coord.x} cy={coord.y} r="5" stroke="#000" strokeWidth="1.5" />
                                                                <text x={coord.x} y={coord.y - 8} fontSize="7" fill="#fff" textAnchor="middle" fontWeight="bold" stroke="#000" strokeWidth="0.8" paintOrder="stroke">{coord.side}</text>
                                                            </g>
                                                        ))
                                                    ))}

                                                    {/* Back Hand & Soles NG indicators */}
                                                    <g>
                                                        {/* Right Sole */}
                                                        <circle cx="85" cy="385" r="5" stroke="#ff0050" strokeWidth="1.5" fill="none" opacity="0.85" />
                                                        <line x1="81" y1="381" x2="89" y2="389" stroke="#ff0050" strokeWidth="1.5" opacity="0.85" />
                                                        <line x1="89" y1="381" x2="81" y2="389" stroke="#ff0050" strokeWidth="1.5" opacity="0.85" />
                                                        
                                                        {/* Left Sole */}
                                                        <circle cx="115" cy="385" r="5" stroke="#ff0050" strokeWidth="1.5" fill="none" opacity="0.85" />
                                                        <line x1="111" y1="381" x2="119" y2="389" stroke="#ff0050" strokeWidth="1.5" opacity="0.85" />
                                                        <line x1="119" y1="381" x2="111" y2="389" stroke="#ff0050" strokeWidth="1.5" opacity="0.85" />

                                                        <text x="100" y="396" fontSize="5" fill="#ff0050" textAnchor="middle" fontWeight="bold">足底NG</text>
                                                    </g>
                                                </svg>
                                            </div>
                                        </div>

                                    </div>

                                    {/* Color Keys */}
                                    <div style={{ display: "flex", justifyContent: "center", gap: "16px", fontSize: "11px", color: "var(--text-muted)" }}>
                                        <span style={{ display: "inline-flex", alignItems: "center", gap: "6px" }}>
                                            <span style={{ width: "8px", height: "8px", borderRadius: "50%", background: "var(--primary)" }}></span> 基本姿勢パッチ (6枚)
                                        </span>
                                        <span style={{ display: "inline-flex", alignItems: "center", gap: "6px" }}>
                                            <span style={{ width: "8px", height: "8px", borderRadius: "50%", background: "var(--secondary)" }}></span> カスタム強化パッチ (4枚)
                                        </span>
                                    </div>
                                </div>
                            </Col>

                        </Row>

                        {/* Portal Mockup Connection Card */}
                        <div className="info-card" style={{ background: "linear-gradient(135deg, rgba(30, 200, 100, 0.03) 0%, rgba(0, 240, 255, 0.03) 100%)", border: "1px solid rgba(0, 240, 255, 0.15)", margin: 0 }}>
                            <h3 style={{ color: "var(--secondary)", display: "flex", alignItems: "center", gap: "8px", fontSize: "14px" }}><i className="fa-solid fa-graduation-cap"></i> ジュニア・保護者のための特別授業</h3>
                            <p style={{ fontSize: "11px", lineHeight: "1.5", color: "var(--text-main)", margin: "0 0 10px 0" }}>
                                パッチの正しい貼り方・コツや、子供の運動能力を伸ばす「皮膚刺激と脳」の関係について、公式ポータル（CORE CONNECT）で専門的に優しく解説しています。
                            </p>
                            <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                                <a href="https://bclab2020.github.io/portal-mockup/" target="_self" className="btn btn-secondary" style={{ textDecoration: "none", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: "8px", background: "#232325", border: "1px solid rgba(255,255,255,0.1)", color: "#ffffff" }}>
                                    <i className="fa-solid fa-book-open"></i> CORE CONNECT で詳しく学ぶ
                                </a>
                                <span style={{ display: "block", textAlign: "center", fontSize: "9px", color: "var(--text-muted)", marginTop: "2px" }}>
                                    ※読み終わった後は、ブラウザの「戻る」ボタンやスワイプ操作で簡単にアプリに戻れます。
                                </span>
                            </div>
                        </div>

                        {/* Physiological Evidence Footer with Citations */}
                        <footer style={{ borderTop: "1px solid var(--border-color)", paddingTop: "16px", marginTop: "12px", fontSize: "10px", color: "var(--text-muted)", lineHeight: "1.5" }}>
                            <h5 style={{ color: "var(--text-main)", margin: "0 0 6px 0", fontSize: "11px" }}>🔬 神経生理学的エビデンス（感覚フィードバック機構）</h5>
                            <p style={{ margin: "0 0 4px 0" }}>
                                *1 **SA-I 機械受容器 (Merkel細胞受容複合体)**: 物理的圧迫とせん断力に持続的（遅順応）に反応し、脳へ常に貼付部位の絶対位置情報を発信します。
                            </p>
                            <p style={{ margin: "0 0 4px 0" }}>
                                *2 **SA-II 機械受容器 (Ruffini終末)**: 皮膚の張力（引っ張り）に鋭敏に反応し、関節角度の変化や動作中の関節運動感覚（固有受容感覚：Proprioception）を高解像度化します。
                            </p>
                            <p style={{ margin: "0 0 6px 0" }}>
                                *3 **体性感覚皮質の再マッピング**: パッチ表面の微細突起突起刺激により脳の小脳および体性感覚野における該当部位の「ホムンクルス表現領域（アライメント解像度）」を拡大し、運動連鎖の遅延（コンマ数秒の遅れ）を軽減します。(※本プロトコルは感覚入力最適化による運動学習サポート効果を提供するものです。)
                            </p>
                            <Divider style={{ margin: "8px 0", borderColor: "rgba(255,255,255,0.06)" }} />
                            <p style={{ margin: 0, fontStyle: "italic", fontSize: "9px", opacity: 0.8 }}>
                                【学術参考文献】<br />
                                - Menz, H. B., et al. (2005). Foot stimulation and postural stability in older adults. *Journal of NeuroEngineering and Rehabilitation*, 2(1), 19.<br />
                                - Proske, U., & Gandevia, S. C. (2012). The proprioceptive senses: Their roles in signaling joint position, movement, and muscle force. *Physiological Reviews*, 92(4), 1651-1697.
                            </p>
                        </footer>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<KineticLinkApp />);
    </script>
</body>
</html>
