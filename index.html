            const [hoveredPointId, setHoveredPointId] = React.useState(null);
            
            // ROM Self-Check VAS Scores (0 = smooth, 10 = painful/stuck)
            const [vasScores, setVasScores] = React.useState({
                flexion: 5,
                extension: 5,
                lateral: 5,
                rotation: 5
            });

            // Assessment History
            const [vasHistory, setVasHistory] = React.useState(() => {
                const saved = localStorage.getItem('bclab_vas_history');
                return saved ? JSON.parse(saved) : [];
            });

            // Selected base patches IDs (derived from ROM evaluation)
            const [selectedBasePatches, setSelectedBasePatches] = React.useState([]);
            
            // Admin coordinate adjustment and database management states
            const [isAdmin, setIsAdmin] = React.useState(false);
            const [editMode, setEditMode] = React.useState(false);
            const [selectedPoint, setSelectedPoint] = React.useState(null);
            const [isSpecsModalOpen, setIsSpecsModalOpen] = React.useState(false);
            const [isAdminModalOpen, setIsAdminModalOpen] = React.useState(false);
            const [adminTab, setAdminTab] = React.useState('edit'); // 'edit', 'add', 'patches'
            
            // Admin forms input fields states
            const [adminSelectedSport, setAdminSelectedSport] = React.useState(null);
            const [adminSportName, setAdminSportName] = React.useState("");
            const [adminSportDesc, setAdminSportDesc] = React.useState("");
            const [adminSportCategory, setAdminSportCategory] = React.useState("running");
            const [adminSportChains, setAdminSportChains] = React.useState("");

            const [newSportId, setNewSportId] = React.useState("");
            const [newSportName, setNewSportName] = React.useState("");
            const [newSportDesc, setNewSportDesc] = React.useState("");
            const [newSportCategory, setNewSportCategory] = React.useState("running");
            const [newSportChains, setNewSportChains] = React.useState("");

            const [adminPatchCategory, setAdminPatchCategory] = React.useState("running");

            // Persistent Coordinates loaded from localStorage or initialized with defaults
            const [basePatchPool, setBasePatchPool] = React.useState(() => {
                const saved = localStorage.getItem('bclab_custom_base_pool');
                return saved ? JSON.parse(saved) : INITIAL_BASE_PATCH_POOL;
            });
            const [coordinates, setCoordinates] = React.useState(() => {
                const saved = localStorage.getItem('bclab_custom_sports_data');
                return saved ? JSON.parse(saved) : INITIAL_PROTOCOL_DATA;
            });
            const [customPatchPool, setCustomPatchPool] = React.useState(() => {
                const saved = localStorage.getItem('bclab_custom_patch_pool');
                return saved ? JSON.parse(saved) : CUSTOM_PATCH_POOL;
            });
            const [selectedConcern, setSelectedConcern] = React.useState(null);
            const [adminPatchId, setAdminPatchId] = React.useState(null);

            // Checkbox states to ensure active interaction
            const [baseChecked, setBaseChecked] = React.useState({
                achilles: false,
                sternum: false,
                fibular: false,
                scapula: false
            });
            const [customChecked, setCustomChecked] = React.useState({
                custom1: false,
                custom2: false
            });

            // Consent validation effect
            React.useEffect(() => {
                // Developer/Testing bypass via URL query parameter (e.g., ?bypass or ?dev or ?consent)
                const query = new URLSearchParams(window.location.search);
                if (query.has('bypass') || query.has('dev') || query.has('consent')) {
                    setHasConsented(true);
                    return;
                }

                const saved = localStorage.getItem('patchAppConsent');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed && parsed.version === CONSENT_VERSION) {
                            setHasConsented(true);
                        }
                    } catch (e) {
                        console.error("Consent load error", e);
                    }
                }
            }, []);

            // Service worker and notifications initializer
            React.useEffect(() => {
                // Register PWA service worker
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('./sw.js')
                        .then(reg => console.log('ServiceWorker registered:', reg.scope))
                        .catch(err => console.error('ServiceWorker failed:', err));
                }

                // Check for core connect updates via GitHub Commits API
                checkPortalUpdates();
            }, []);

            // Check portal updates function
            async function checkPortalUpdates() {
                try {
                    const response = await fetch("https://api.github.com/repos/bclab2020/portal-mockup/commits");
                    if (!response.ok) return;
                    const commits = await response.json();
                    if (commits && commits.length > 0) {
                        const latestSha = commits[0].sha;
                        const savedSha = localStorage.getItem('last_notified_portal_sha');
                        const commitMsg = commits[0].commit.message || 'コンテンツが更新されました。';
                        
                        if (savedSha && savedSha !== latestSha && Notification.permission === "granted") {
                            new Notification("【CORE CONNECT 更新】", {
                                body: commitMsg,
                                icon: "icon.svg"
                            });
                        }
                        localStorage.setItem('last_notified_portal_sha', latestSha);
                    }
                } catch (e) {
                    console.error("更新チェックエラー:", e);
                }
            }

            // Next button conditions
            const isNextDisabled = () => {
                if (currentStep === 0) {
                    if (subStep === 'check') return true;
                    // Check if all selected base patches are checked off
                    return !selectedBasePatches.every(patchId => baseChecked[patchId]);
                }
                if (currentStep === 1) {
                    return !selectedSport || !selectedConcern;
                }
                if (currentStep === 2) {
                    return !(customChecked.custom1 && customChecked.custom2);
                }
                return false;
            };

            const handleNext = () => {
                if (currentStep < 2) {
                    setCurrentStep(currentStep + 1);
                } else {
                    // Protocol Completion modal/toast
                    notification.success({
                        message: "プロトコル貼付完了",
                        description: (
                            <div>
                                <p>合計10枚の感覚フィードバックパッチがすべて正しく貼付されました！神経筋制御が最適化された状態でトレーニングを開始してください。</p>
                                <div style={{ marginTop: "12px", borderTop: "1px solid rgba(255,255,255,0.06)", paddingTop: "8px" }}>
                                    <span style={{ fontSize: "11px", color: "var(--secondary)", fontWeight: "bold" }}>📱 改善成果をシェアしませんか？</span>
                                    <p style={{ fontSize: "10px", margin: "4px 0 8px 0" }}>前回の身体測定履歴と比較した動きやすさの改善をSNSに発信できます。</p>
                                    {vasHistory.length > 1 ? (
                                        <Button 
                                            size="small" 
                                            type="primary" 
                                            style={{ background: "linear-gradient(135deg, #1DA1F2 0%, #0d8bd9 100%)", borderColor: "transparent", fontSize: "10px", color: "#fff" }}
                                            onClick={() => handleSnsShare(vasHistory[vasHistory.length - 1], vasHistory[0])}
                                        >
                                            <i className="fa-brands fa-x-twitter"></i> 改善の喜びをポストする
                                        </Button>
                                    ) : (
                                        <Button 
                                            size="small" 
                                            type="primary" 
                                            style={{ background: "linear-gradient(135deg, #1DA1F2 0%, #0d8bd9 100%)", borderColor: "transparent", fontSize: "10px", color: "#fff" }}
                                            onClick={() => handleSnsShare(null, vasHistory[0] || vasScores)}
                                        >
                                            <i className="fa-brands fa-x-twitter"></i> 状態をポストする
                                        </Button>
                                    )}
                                </div>
                            </div>
                        ),
                        duration: 0,
                        placement: "topRight"
                    });
                }
            };

            const handlePrev = () => {
                if (currentStep > 0) {
                    setCurrentStep(currentStep - 1);
                }
            };

            const handleSportSelect = (sportId) => {
                setSelectedSport(sportId);
                setSelectedConcern(null);
                // Reset custom check states
                setCustomChecked({ custom1: false, custom2: false });
            };

            const getSelectedSportData = () => {
                return coordinates.sportsOptions[selectedSport] || null;
            };

            // Compile active patch coordinates for visual overlays
            const getActivePoints = () => {
                let points = [];
                
                // Base patches (rendered only if selectedBasePatches has them and currentStep is 0 or 1/2)
                selectedBasePatches.forEach(patchId => {
                    const p = basePatchPool[patchId];
                    if (p) {
                        const isHighlighted = hoveredPointId === p.id;
                        const isActive = currentStep === 0 && !baseChecked[p.id];
                        points.push({
                            ...p,
                            type: 'base',
                            highlighted: isHighlighted,
                            active: isActive
                        });
                    }
                });

                // Custom patches (visible if sport selected, concern selected and currentStep is 1 or 2)
                if (selectedSport && selectedConcern && currentStep >= 1) {
                    const sportData = getSelectedSportData();
                    if (sportData) {
                        const concern = sportData.concerns?.find(c => c.id === selectedConcern);
                        if (concern) {
                            concern.patchIds.forEach((patchId, idx) => {
                                const p = customPatchPool[patchId];
                                if (p) {
                                    const isHighlighted = hoveredPointId === p.id;
                                    const checkKey = idx === 0 ? 'custom1' : 'custom2';
                                    const isActive = currentStep === 2 && !customChecked[checkKey];
                                    points.push({
                                        ...p,
                                        type: 'custom',
                                        highlighted: isHighlighted,
                                        active: isActive
                                    });
                                }
                            });
                        }
                    }
                }
                return points;
            };

            const activePoints = getActivePoints();

            // Admin Lock handling
            const handleAdminLockClick = () => {
                if (isAdmin) {
                    setIsAdmin(false);
                    setEditMode(false);
                    setSelectedPoint(null);
                    showToast("管理者モードからログアウトしました。");
                } else {
                    const pwd = prompt("管理者パスワードを入力してください:");
                    if (pwd === 'bclab2009') {
                        setIsAdmin(true);
                        showToast("管理者認証に成功しました。ヘッダーの「管理画面」を開けます。");
                    } else if (pwd !== null) {
                        showToast("パスワードが正しくありません。");
                    }
                }
            };

            // Handle coordinate movement via D-pad
            const handleMove = (dx, dy) => {
                if (!selectedPoint) return;
                
                if (selectedPoint.type === 'base') {
                    setBasePatchPool(prevPool => {
                        const nextPool = JSON.parse(JSON.stringify(prevPool));
                        const patch = nextPool[selectedPoint.id];
                        if (patch) {
                            const coord = patch.coords[selectedPoint.coordIdx];
                            if (coord) {
                                coord.x += dx;
                                coord.y += dy;
                                setSelectedPoint({ ...selectedPoint, x: coord.x, y: coord.y });
                            }
                        }
                        return nextPool;
                    });
                } else {
                    setCustomPatchPool(prevPool => {
                        const nextPool = JSON.parse(JSON.stringify(prevPool));
                        const patch = nextPool[selectedPoint.id];
                        if (patch) {
                            const coord = patch.coords[selectedPoint.coordIdx];
                            if (coord) {
                                coord.x += dx;
                                coord.y += dy;
                                setSelectedPoint({ ...selectedPoint, x: coord.x, y: coord.y });
                            }
                        }
                        return nextPool;
                    });
                }
            };

            // Save and finalize adjusted coordinates to localStorage
            const handleFinalizeCoordinates = () => {
                localStorage.setItem('bclab_custom_base_pool', JSON.stringify(basePatchPool));
                localStorage.setItem('bclab_custom_patch_pool', JSON.stringify(customPatchPool));
                localStorage.setItem('bclab_custom_sports_data', JSON.stringify(coordinates));
                showToast("調整後の座標データをブラウザに確定保存しました！次回起動時もこの座標が適用されます。");
            };

            // Reset coordinates to database defaults
            const handleResetCoordinates = () => {
                if (confirm("全ての貼付データ（種目の追加状況や座標値）を完全に初期位置（デフォルト）に戻しますか？")) {
                    localStorage.removeItem('bclab_custom_base_pool');
                    localStorage.removeItem('bclab_custom_patch_pool');
                    localStorage.removeItem('bclab_custom_sports_data');
                    setBasePatchPool(INITIAL_BASE_PATCH_POOL);
                    setCustomPatchPool(CUSTOM_PATCH_POOL);
                    setCoordinates(INITIAL_PROTOCOL_DATA);
                    setSelectedPoint(null);
                    setSelectedSport(null);
                    setSelectedConcern(null);
                    showToast("データベースをデフォルト状態にリセットしました。");
                }
            };

            // Export coordinates as JSON log
            const handleExportCoordinates = () => {
                const combined = {
                    basePatches: Object.values(basePatchPool),
                    customPatches: Object.values(customPatchPool),
                    sportsOptions: coordinates.sportsOptions
                };
                const formatted = JSON.stringify(combined, null, 2);
                notification.info({
                    message: "座標データ（JSON）",
                    description: (
                        <div>
                            <p style={{ fontSize: "11px" }}>以下のJSONデータをコピーしてコードに貼り付けられます：</p>
                            <textarea 
                                style={{ width: '100%', height: '150px', background: '#000', color: '#00f0ff', fontSize: '9px', fontFamily: 'monospace', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '4px', padding: '6px' }} 
                                readOnly 
                                value={formatted}
                                onClick={(e) => { e.target.select(); document.execCommand('copy'); showToast('コピーしました！'); }}
                            />
                            <span style={{ fontSize: '9px', color: 'var(--text-muted)' }}>※テキストエリアをクリックすると全選択・自動コピーされます。</span>
                        </div>
                    ),
                    duration: 0
                });
            };

            // Handle basic consent form submission
            const handleConsentSubmit = () => {
                const consentData = {
                    version: CONSENT_VERSION,
                    acceptedAt: new Date().toISOString(),
                    ageGroup: consentAge,
                    guardianConfirmed: consentAge === 'minor'
                };
                localStorage.setItem('patchAppConsent', JSON.stringify(consentData));
                setHasConsented(true);
                showToast("利用同意が完了しました！アプリをご利用いただけます。");
            };

            const isConsentSubmitDisabled = !consentAge ||
                !(termsAccepted && rulesAccepted) ||
                (consentAge === 'minor' && !(parentWithChecked && parentConsentChecked));

            // Evaluate sliders and determine top 3 base patches
            const evaluateAndSetBasePatches = () => {
                // Save current assessment to history array
                const entry = {
                    date: new Date().toLocaleString('ja-JP', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
                    ...vasScores
                };
                const newHistory = [entry, ...vasHistory];
                setVasHistory(newHistory);
                localStorage.setItem('bclab_vas_history', JSON.stringify(newHistory));

                // Sort movements by score (high score means restriction)
                const movements = [
                    { id: 'achilles', score: vasScores.flexion },
                    { id: 'sternum', score: vasScores.extension },
                    { id: 'fibular', score: vasScores.lateral },
                    { id: 'scapula', score: vasScores.rotation }
                ];
                
                // Sort descending. If tie, preserve order: flexion > extension > lateral > rotation
                movements.sort((a, b) => b.score - a.score);
                const selected = movements.slice(0, 3).map(m => m.id);
                
                setSelectedBasePatches(selected);
                setSubStep('patching');
                
                // Reset check states for new base selection
                setBaseChecked({
                    achilles: false,
                    sternum: false,
                    fibular: false,
                    scapula: false
                });

                showToast("動作チェックに基づき、ベースパッチの自動選定が完了しました！");
            };

            // SNS Share trigger
            const handleSnsShare = (earliest, latest) => {
                let text = "";
                if (earliest) {
                    const flexionDiff = latest.flexion - earliest.flexion;
                    const extensionDiff = latest.extension - earliest.extension;
                    const lateralDiff = latest.lateral - earliest.lateral;
                    const rotationDiff = latest.rotation - earliest.rotation;
                    
                    let improvements = [];
                    if (flexionDiff < 0) improvements.push(`・前屈の硬さ: ${earliest.flexion} ➔ ${latest.flexion}`);
                    if (extensionDiff < 0) improvements.push(`・後屈の硬さ: ${earliest.extension} ➔ ${latest.extension}`);
                    if (lateralDiff < 0) improvements.push(`・側屈の硬さ: ${earliest.lateral} ➔ ${latest.lateral}`);
                    if (rotationDiff < 0) improvements.push(`・回旋の硬さ: ${earliest.rotation} ➔ ${latest.rotation}`);
                    
                    if (improvements.length > 0) {
                        text = `【BCLab 動作診断レポート】\nKINETIC-LINK 109 を貼って動作チェックしたところ、筋膜連鎖の滞りが解消され、可動域が大幅に向上しました！\n\n可動域の変化:\n${improvements.join('\n')}\n\n皮膚刺激によるアライメント調整効果を体感中！\n#BCLab #KineticLink109 #筋膜アライメント #感覚フィードバック`;
                    }
                }
                
                if (!text) {
                    text = `【BCLab 動作診断レポート】\nKINETIC-LINK 109 の姿勢反射フィードバックシステムを体験中！\n身体チェックによる制限箇所:\n・前屈: ${latest.flexion}/10 | 後屈: ${latest.extension}/10\n・側屈: ${latest.lateral}/10 | 回旋: ${latest.rotation}/10\n\nパッチ刺激で動作が軽くなります！\n#BCLab #KineticLink109 #感覚フィードバック #AnatomyTrains`;
                }

                const tweetUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
                window.open(tweetUrl, '_blank');
            };

            return (
                <div className="app-container">
                    {/* Header */}
                    <header className="app-header">
                        <div className="header-logo" style={{ display: "flex", flexDirection: "row", alignItems: "center", gap: "8px" }}>
                            <img src="logo_mark.png" alt="B.C Lab Logo Mark" style={{ height: "24px", width: "auto" }} />
                            <div style={{ display: "flex", flexDirection: "column" }}>
                                <div><span className="logo-bc">B.C</span><span className="logo-lab">Lab</span></div>
                                <span className="logo-sub">KINETIC-LINK 109</span>
                            </div>
                        </div>
                        
                        <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                            {currentView === 'map' && (
                                <Button 
                                    size="small" 
                                    onClick={() => { setCurrentView('home'); setEditMode(false); setSelectedPoint(null); }}
                                    style={{ background: "rgba(255,255,255,0.06)", borderColor: "rgba(255,255,255,0.1)", color: "#fff", fontSize: "11px" }}
                                >
                                    <i className="fa-solid fa-house" style={{ marginRight: "4px" }}></i><span className="hide-mobile"> ホーム</span>
                                </Button>
                            )}
                            
                            {/* React Admin Management button */}
                            {isAdmin && (
                                <Button 
                                    size="small" 
                                    onClick={() => {
                                        setIsAdminModalOpen(true);
                                        const firstSport = Object.keys(coordinates.sportsOptions)[0];
                                        if (firstSport) {
                                            setAdminSelectedSport(firstSport);
                                            const sp = coordinates.sportsOptions[firstSport];
                                            setAdminSportName(sp.name);
                                            setAdminSportDesc(sp.desc);
                                            setAdminSportCategory(sp.category);
                                            setAdminSportChains(sp.chains);
                                        }
                                    }}
                                    style={{ background: "rgba(255,100,200,0.12)", borderColor: "rgba(255,100,200,0.35)", color: "var(--accent)", fontSize: "11px" }}
                                >
                                    <i className="fa-solid fa-database" style={{ marginRight: "4px" }}></i><span className="hide-mobile"> 管理画面</span>
                                </Button>
                            )}

                            <div className="adhesive-badge" style={{ background: "rgba(0, 240, 255, 0.1)", border: "1px solid rgba(0, 240, 255, 0.3)" }}>
                                <i className="fa-solid fa-circle-dot" style={{ color: "var(--secondary)" }}></i>
                                <span><span className="hide-mobile">パッチ枚数: </span><strong style={{ color: "var(--secondary)" }}>
                                    {((baseChecked.achilles && selectedBasePatches.includes('achilles')) ? 2 : 0) + 
                                     ((baseChecked.sternum && selectedBasePatches.includes('sternum')) ? 2 : 0) + 
                                     ((baseChecked.fibular && selectedBasePatches.includes('fibular')) ? 2 : 0) + 
                                     ((baseChecked.scapula && selectedBasePatches.includes('scapula')) ? 2 : 0) + 
                                     (customChecked.custom1 ? 2 : 0) + (customChecked.custom2 ? 2 : 0)}
                                </strong> / 10 枚</span>
                            </div>
                            <button 
                                className="admin-lock-trigger" 
                                onClick={handleAdminLockClick} 
                                style={{ background: "none", border: "none", color: isAdmin ? "var(--secondary)" : "var(--text-muted)", cursor: "pointer", padding: "4px", fontSize: "14px", transition: "color 0.2s" }}
                                title={isAdmin ? "管理者ログアウト" : "管理者ログイン"}
                            >
                                <i className={isAdmin ? "fa-solid fa-lock-open" : "fa-solid fa-lock"}></i>
                            </button>
                        </div>
                    </header>

                    {/* View rendering wrapped in app-main to prevent flex crush */}
                    <div className="app-main" style={{ padding: 0 }}>
                        {currentView === 'home' ? (
                        /* HOME VIEW (Original Design + History Track + SNS Share) */
                        <div style={{ padding: "24px", display: "flex", flexDirection: "column", gap: "20px" }}>
                            
                            {/* Welcome Card with Dynamic Brain SVG */}
                            <div className="welcome-box-card">
                                <div className="welcome-polygon-left"></div>
                                <div className="welcome-polygon-right"></div>
                                <div className="welcome-box-inner" style={{ padding: "20px" }}>
                                    <span className="welcome-brand">KINETIC-LINK 109</span>
                                    <span className="welcome-sub">SENSORY PATCHES</span>
                                    <span className="welcome-tech-detail" style={{ fontFamily: "var(--font-outfit)", fontSize: "7px", color: "var(--text-muted)", letterSpacing: "1.2px", marginTop: "-5px", marginBottom: "3px", textTransform: "uppercase" }}>Neuro-Kinetic Feedback Technology</span>
                                    <span className="welcome-pack-detail" style={{ fontFamily: "var(--font-outfit)", fontSize: "6px", color: "var(--text-muted)", opacity: 0.6, letterSpacing: "0.5px", marginTop: "-1px", marginBottom: "8px" }}>(10 PATCHES | Dedicated Stickers 48 Sheets)</span>
                                    
                                    <div className="welcome-graphic-container" style={{ margin: "10px 0" }}>
                                        <svg viewBox="0 0 200 160" className="welcome-brain-svg" style={{ maxHeight: "160px", width: "100%" }}>
                                            <defs>
                                                <filter id="welcome-glow" x="-20%" y="-20%" width="140%" height="140%">
                                                    <feGaussianBlur stdDeviation="2.5" result="blur" />
                                                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                                                </filter>
                                            </defs>
                                            
                                            <g stroke="#00f0ff" strokeWidth="0.8" opacity="0.75" fill="none">
                                                <line x1="80" y1="25" x2="60" y2="35" />
                                                <line x1="60" y1="35" x2="45" y2="55" />
                                                <line x1="45" y1="55" x2="40" y2="80" />
                                                <line x1="40" y1="80" x2="45" y2="105" />
                                                <line x1="45" y1="105" x2="60" y2="125" />
                                                <line x1="60" y1="125" x2="80" y2="135" />
                                                <line x1="92" y1="35" x2="92" y2="60" />
                                                <line x1="92" y1="60" x2="92" y2="80" />
                                                <line x1="92" y1="80" x2="92" y2="100" />
                                                <line x1="92" y1="100" x2="92" y2="125" />
                                                <line x1="80" y1="25" x2="92" y2="35" />
                                                <line x1="80" y1="135" x2="92" y2="125" />
                                                <line x1="80" y1="25" x2="80" y2="55" />
                                                <line x1="60" y1="35" x2="80" y2="55" />
                                                <line x1="92" y1="35" x2="80" y2="55" />
                                                <line x1="92" y1="60" x2="80" y2="55" />

                                                        const newName = e.target.value;
                                                        setCustomPatchPool(prev => {
                                                            const next = JSON.parse(JSON.stringify(prev));
                                                            next[activeId].name = newName;
                                                            return next;
                                                        });
                                                    }} 
                                                    style={{ width: "100%", background: "rgba(0,0,0,0.3)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: "4px", color: "#fff", padding: "6px 8px", fontSize: "11px" }}
                                                />
                                            </div>
                                            
                                            <div style={{ marginBottom: "8px" }}>
                                                <label style={{ fontSize: "9px", color: "var(--text-muted)", display: "block", marginBottom: "2px" }}>経絡ライン（Anatomy Trains）</label>
                                                <input 
                                                    type="text" 
                                                    value={patch.meridian} 
                                                    onChange={(e) => {
                                                        const newMeridian = e.target.value;
                                                        setCustomPatchPool(prev => {
                                                            const next = JSON.parse(JSON.stringify(prev));
                                                            next[activeId].meridian = newMeridian;
                                                            return next;
                                                        });
                                                    }} 
                                                    style={{ width: "100%", background: "rgba(0,0,0,0.3)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: "4px", color: "#fff", padding: "6px 8px", fontSize: "11px" }}
                                                />
                                            </div>

                                            <div>
                                                <label style={{ fontSize: "9px", color: "var(--text-muted)", display: "block", marginBottom: "2px" }}>貼り方感覚フィードバック解説</label>
                                                <textarea 
                                                    value={patch.desc} 
                                                    rows="3"
                                                    onChange={(e) => {
                                                        const newDesc = e.target.value;
                                                        setCustomPatchPool(prev => {
                                                            const next = JSON.parse(JSON.stringify(prev));
                                                            next[activeId].desc = newDesc;
                                                            return next;
                                                        });
                                                    }} 
                                                    style={{ width: "100%", background: "rgba(0,0,0,0.3)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: "4px", color: "#fff", padding: "6px 8px", fontSize: "11px", resize: "none", lineHeight: "1.4" }}
                                                />
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        )}

                        {/* Modal Footer Controls */}
                        <div style={{ display: "flex", gap: "8px", borderTop: "1px solid rgba(255,255,255,0.06)", paddingTop: "15px", marginTop: "15px" }}>
                            <Button 
                                style={{ flex: 1 }} 
                                onClick={handleResetCoordinates}
                                danger
                            >
                                デフォルト初期化
                            </Button>
                            <Button 
                                type="primary" 
                                style={{ flex: 1.5 }} 
                                onClick={() => {
                                    handleFinalizeCoordinates();
                                    setIsAdminModalOpen(false);
                                }}
                            >
                                <i className="fa-solid fa-circle-check"></i> 確定保存して閉じる
                            </Button>
                        </div>
                    </Modal>

                    {/* Consenting Gate overlay (fullscreen white-base modal) */}
                    {!hasConsented && (
                        <div className="consent-overlay">
                            <div className="consent-card-white">
                                <div className="consent-header">
                                    <h2 className="consent-title">はじめにご確認ください</h2>
                                </div>
                                
                                <div className="consent-body">
                                    <p style={{ margin: 0, fontSize: "13px", color: "#475569", fontWeight: "bold" }}>
                                        このアプリは、BC Lab シリコンパッチの貼付方法、使用上の注意、運用ルールを案内するためのガイドアプリです。
                                    </p>
                                    
                                    <div className="consent-section">
                                        <h4 className="consent-section-title">
                                            <i className="fa-solid fa-circle-exclamation"></i> 使用上の重要事項
                                        </h4>
                                        <p className="consent-para">
                                            本製品は、医師による診断・治療・処方の代替を目的とするものではありません。皮膚状態や体調に不安がある場合は、使用を中止し、必要に応じて医療機関へご相談ください。
                                        </p>
                                    </div>
                                    
                                    <div className="consent-section">
                                        <h4 className="consent-section-title">
                                            <i className="fa-solid fa-gavel"></i> ルールの優先適用
                                        </h4>
                                        <p className="consent-para">
                                            競技会、学校、部活動、大会、チームのルールがある場合は、それらが本アプリの案内よりも優先されます。公式戦、大会会場、学校管理下の活動中に使用する場合は、必ず事前に各ルールをご確認ください。
                                        </p>
                                    </div>
                                    
                                    <div className="consent-section">
                                        <h4 className="consent-section-title">
                                            <i className="fa-solid fa-user-check"></i> 年齢確認と保護者確認
                                        </h4>
                                        <p className="consent-para">
                                            18歳未満の方は、保護者と一緒に内容を確認してください。
                                        </p>
                                        
                                        <div style={{ marginTop: "12px" }}>
                                            <span style={{ fontSize: "11px", color: "#64748b", fontWeight: "bold", display: "block", marginBottom: "4px" }}>年齢確認：あなたに当てはまるものを選択してください。</span>
                                            <div className="consent-age-selector">
                                                <div 
                                                    className={`consent-age-btn ${consentAge === 'adult' ? 'selected' : ''}`}
                                                    onClick={() => {
                                                        setConsentAge('adult');
                                                        setParentWithChecked(false);
                                                        setParentConsentChecked(false);
                                                    }}
                                                >
                                                    私は18歳以上です
                                                </div>
                                                <div 
                                                    className={`consent-age-btn ${consentAge === 'minor' ? 'selected' : ''}`}
                                                    onClick={() => setConsentAge('minor')}
                                                >
                                                    私は18歳未満です
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    {consentAge === 'minor' && (
                                        <div className="consent-minor-section">
                                            <h4 className="consent-section-title" style={{ color: "#be123c" }}>
                                                <i className="fa-solid fa-users" style={{ color: "#be123c" }}></i> 保護者確認事項
                                            </h4>
                                            <p className="consent-para" style={{ color: "#9f1239", fontSize: "12px", marginBottom: "8px" }}>
                                                18歳未満の方による本アプリの利用には、保護者の確認が必要です。
                                            </p>
                                            <div className="consent-checkbox-group">
                                                <label className="consent-label">
                                                    <input 
                                                        type="checkbox" 
                                                        checked={parentWithChecked} 
                                                        onChange={(e) => setParentWithChecked(e.target.checked)}
                                                    />
                                                    <span>保護者と一緒に内容を確認しました</span>
                                                </label>
                                                <label className="consent-label">
                                                    <input 
                                                        type="checkbox" 
                                                        checked={parentConsentChecked} 
                                                        onChange={(e) => setParentConsentChecked(e.target.checked)}
                                                    />
                                                    <span>保護者が、本アプリの利用に同意しています</span>
                                                </label>
                                            </div>
                                        </div>
                                    )}
                                    
                                    <div className="consent-checkbox-group" style={{ borderTop: "1px solid #f1f5f9", paddingTop: "14px" }}>
                                        <label className="consent-label">
                                            <input 
                                                type="checkbox" 
                                                checked={termsAccepted} 
                                                onChange={(e) => setTermsAccepted(e.target.checked)}
                                            />
                                            <span>
                                                利用規約、プライバシーポリシー、および使用上の注意を確認しました
                                            </span>
                                        </label>
                                        <label className="consent-label">
                                            <input 
                                                type="checkbox" 
                                                checked={rulesAccepted} 
                                                onChange={(e) => setRulesAccepted(e.target.checked)}
                                            />
                                            <span>
                                                競技規程、学校・大会・チームのルールが優先されることを理解しました
                                            </span>
                                        </label>
                                    </div>
                                </div>
                                
                                <div className="consent-footer">
                                    <Button 
                                        type="primary" 
                                        size="large" 
                                        block 
                                        disabled={isConsentSubmitDisabled}
                                        onClick={handleConsentSubmit}
                                        style={{ 
                                            height: "44px", 
                                            fontSize: "14px", 
                                            fontWeight: "bold",
                                            borderRadius: "10px",
                                            background: isConsentSubmitDisabled ? "#cbd5e1" : "#2563eb",
                                            borderColor: isConsentSubmitDisabled ? "#cbd5e1" : "#2563eb",
                                            color: isConsentSubmitDisabled ? "#94a3b8" : "#ffffff"
                                        }}
                                    >
                                        同意して次へ
                                    </Button>
                                    
                                    <div className="consent-sublinks">
                                        <span className="consent-link" onClick={() => setDocModalType('terms')}>利用規約を見る</span>
                                        <span style={{ color: "#cbd5e1" }}>|</span>
                                        <span className="consent-link" onClick={() => setDocModalType('privacy')}>プライバシーポリシーを見る</span>
                                        <span style={{ color: "#cbd5e1" }}>|</span>
                                        <span className="consent-link" onClick={() => setDocModalType('usage')}>使用上の注意を見る</span>
                                    </div>
                                    
                                    <p className="consent-note">※ 同意内容は、利用日時とあわせて記録されます。</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Secondary Terms/Privacy/Usage Modals */}
                    {docModalType && (
                        <div className="consent-doc-modal-overlay" onClick={() => setDocModalType(null)}>
                            <div className="consent-doc-modal" onClick={(e) => e.stopPropagation()}>
                                <div className="consent-doc-header">
                                    <h4 className="consent-doc-title">
                                        {docModalType === 'terms' && "利用規約"}
                                        {docModalType === 'privacy' && "プライバシーポリシー"}
                                        {docModalType === 'usage' && "使用上の注意"}
                                        {docModalType === 'sns_guide' && "SNS投稿ガイドライン"}
                                        {docModalType === 'media_policy' && "写真・動画の取り扱いポリシー"}
                                    </h4>
                                    <button 
                                        onClick={() => setDocModalType(null)} 
                                        style={{ background: "none", border: "none", fontSize: "18px", color: "var(--text-muted)", cursor: "pointer" }}
                                    >
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                <div className="consent-doc-body" style={{ whiteSpace: "pre-wrap" }}>
                                    {docModalType === 'terms' && TERMS_TEXT}
                                    {docModalType === 'privacy' && PRIVACY_TEXT}
                                    {docModalType === 'usage' && USAGE_TEXT}
                                    {docModalType === 'sns_guide' && SNS_GUIDE_TEXT}
                                    {docModalType === 'media_policy' && MEDIA_POLICY_TEXT}
                                </div>
                                <div className="consent-doc-footer">
                                    <Button type="primary" size="small" onClick={() => setDocModalType(null)}>
                                        閉じる
                                    </Button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<KineticLinkApp />);
    </script>
</body>
</html>
